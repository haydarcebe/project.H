
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="blackout.css">
    <title>BLACK-OUT</title>
</head>
<body>
    <h1 id="removeblacktitleremove">BLACK-OUT</h1>
    <main class="game">
        <div class="questionpicture hide" id="questionpicture">
            <img src="oldinterface.png" alt="Picture for this question">
            <div class="tiles" id="tiles"></div>
        </div>
 
        <button id="Ready" disabled>READY!!!</button>
 
        <div id="loading" class="loading" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <p>Game wordt geladen...</p>
        </div>
 
        <div id="load-error" class="load-error" role="alert" hidden>
            <p id="load-error-text"></p>
            <button id="retry-button">Opnieuw proberen</button>
        </div>
 
        <div id="explosion" class="explosion" aria-hidden="true"></div>
        <p id="question-counter" aria-live="polite"></p>
        <h2 id="question-text"></h2>
 
        <div id="geefantwoorden" class="hide">
            <button id="antwoordA" class="answer"></button>
            <button id="antwoordB" class="answer"></button>
            <button id="antwoordC" class="answer"></button>
        </div>
        <img id="final-celebration" alt="dancing">
        <p id="round-result" aria-live="polite"></p>
    </main>
    <nav class="page-links" aria-label="Page navigation">
        <a href="../index.html">Return</a>
        <button id="restart-button" class="hide2">Play again</button>
    </nav>
    <script src="../Score/score.js"></script>
    <script src="blackout.js"></script>
</body>
</html>
